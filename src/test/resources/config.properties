# ==============================================
# Framework Configuration
# Override any of these at runtime with:
# mvn test -Dbrowser=firefox -Dheadless=true
# ==============================================

# chrome | firefox | edge
browser=chrome

# Base application URL (used by the sample Google test).
# Change this to point the framework at any other application.
base.url=https://www.google.com

# true to run browsers headless (useful for CI pipelines)
headless=false

# Timeouts (seconds)
implicit.wait=5
explicit.wait=15
page.load.timeout=30

# Maximize browser window on launch
maximize.window=true

# Take a screenshot on every step (not just failures) - true|false
screenshot.on.every.step=false

# ExtentReports Cucumber7 Adapter configuration
# Generates a rich HTML dashboard (charts, pass/fail %, timeline, categories/tags)

extent.reporter.spark.start=true
extent.reporter.spark.out=target/extent-reports/ExtentDashboard.html

extent.reporter.spark.config=src/test/resources/spark-config.json

# Also keep a JSON copy for programmatic/CI consumption
extent.reporter.json.start=true
extent.reporter.json.out=target/extent-reports/ExtentReport.json

systeminfo.OS=${os.name}
systeminfo.Java=${java.version}
systeminfo.Framework=Selenium + Cucumber BDD
